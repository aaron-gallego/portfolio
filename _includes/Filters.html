<!-- Filters.html: La barra de categorías que permite filtrar mis proyectos de forma dinámica (Todos / Diseño gráfico / Diseño UX/UI / Ilustración digital / Vídeo). -->
<section id="filter-section" class="sticky top-[152px] z-30 mt-8 mb-4 lg:mb-12 flex justify-center w-full transition-all duration-500">
    <div id="filter-container" class="relative flex flex-row gap-1 p-1 rounded-full border border-black/10 dark:border-white/10 bg-slate-100/95 dark:bg-[#101622]/95 backdrop-blur-xl shadow-lg w-full overflow-x-auto no-scrollbar">
        
        <div id="filter-highlight" class="absolute h-[calc(100%-8px)] top-1 left-1 rounded-full bg-primary transition-all duration-300 ease-[cubic-bezier(0.4,0,0.2,1)] shadow-lg shadow-primary/30 z-0"></div>

        <button data-filter="all" class="filter-btn active relative z-10 flex-auto flex items-center justify-center rounded-full py-2.5 px-2 text-[9px] sm:text-xs lg:text-sm font-black text-slate-900 dark:text-white transition-colors duration-300 hover:bg-primary/10 hover:text-primary">
            Todos
        </button>

        <button data-filter="Graphic Design" class="filter-btn relative z-10 flex-auto flex items-center justify-center rounded-full py-2.5 px-2 text-[9px] sm:text-xs lg:text-sm font-bold text-slate-700 dark:text-slate-400 transition-colors duration-300 hover:bg-primary/10 hover:text-primary">
            Diseño gráfico
        </button>

        <button data-filter="UX/UI" class="filter-btn relative z-10 flex-auto flex items-center justify-center rounded-full py-2.5 px-2 text-[9px] sm:text-xs lg:text-sm font-bold text-slate-700 dark:text-slate-400 transition-colors duration-300 hover:bg-primary/10 hover:text-primary">
            <span class="hidden md:inline">Diseño&nbsp;</span>UX/UI
        </button>

        <button data-filter="Illustration" class="filter-btn relative z-10 flex-auto flex items-center justify-center rounded-full py-2.5 px-2 text-[9px] sm:text-xs lg:text-sm font-bold text-slate-700 dark:text-slate-400 transition-colors duration-300 hover:bg-primary/10 hover:text-primary">
            Ilustración<span class="hidden md:inline">&nbsp;digital</span>
        </button>

        <button data-filter="Video" class="filter-btn relative z-10 flex-auto flex items-center justify-center rounded-full py-2.5 px-2 text-[9px] sm:text-xs lg:text-sm font-bold text-slate-700 dark:text-slate-400 transition-colors duration-300 hover:bg-primary/10 hover:text-primary">
            Vídeo
        </button>
        
    </div>
</section>
